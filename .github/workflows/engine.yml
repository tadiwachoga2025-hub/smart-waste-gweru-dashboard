name: Engine

# Keeps the prediction/routing engine running in production without a server.
# One job holds the watch loop for ~5h50m; the 5-minute schedule keeps one
# replacement run pending behind it, so a fresh loop starts as soon as the
# previous one reaches its time limit. concurrency guarantees a single writer.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  # Belt and braces: hand off immediately when a run finishes, so the loop
  # survives even if a scheduled trigger is delayed or dropped.
  workflow_run:
    workflows: ["Engine"]
    types: [completed]

concurrency:
  group: smart-waste-engine
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  engine:
    if: >-
      github.repository == 'tadiwachoga2025-hub/smart-waste-gweru-dashboard' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install engine dependencies
        run: pip install -r requirements.txt

      - name: Run engine watch loop
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ vars.FIREBASE_DB_URL || 'https://smart-waste-gweru-default-rtdb.firebaseio.com/' }}
          POLL_INTERVAL_SEC: "300"
          LOG_LEVEL: INFO
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://smart-waste-dashboard-rust.vercel.app' }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          cred="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$cred"
          chmod 600 "$cred"
          export FIREBASE_CRED_PATH="$cred"

          set +e
          # 5h50m < the 6h job limit, so the replacement run is never starved.
          timeout --signal=TERM --kill-after=30s 21000 \
            python -u engine.py --watch "$POLL_INTERVAL_SEC"
          code=$?
          set -e
          # 124 = the timeout fired after an intentional, graceful shutdown.
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            exit "$code"
          fi
